  info: |-
    MSX2 is the 1985 successor to the MSX home computer standard, defined by
    ASCII Corporation and Microsoft. It upgraded the platform with the Yamaha
    V9938 video display processor, 128 KB of video RAM, new bitmap screen
    modes, and battery-backed clock RAM, while remaining fully backward
    compatible with MSX1 software.
    The MSX2 found its greatest success in Japan, where it hosted defining
    entries in series such as Metal Gear, SD Snatcher, Space Manbow and
    Aleste before the platform was discontinued.
    This core embeds the open-source C-BIOS, so cartridge games run with no
    BIOS files; a real machine's BIOS pair can be loaded at runtime for
    software that needs BASIC, and an on-screen keyboard (L+R+Select) covers
    keyboard-driven titles.
